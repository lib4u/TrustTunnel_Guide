user www-data;
worker_processes auto;
pid /run/trusttunnel-site/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    server {
        # Only the endpoint on this machine needs access to the origin.
        listen 127.0.0.1:8081;
        server_name _;
        root /var/www/trusttunnel;
        index index.html;

        # Match the loading SPA used by the WPN node recipe.
        location / {
            try_files $uri /index.html;
        }
    }
}
